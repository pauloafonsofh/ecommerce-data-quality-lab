name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres  # throwaway container used only by this job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint the test runner
        run: shellcheck run_tests.sh

      - name: Run the data-quality suite
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGPORT: "5432"
        run: ./run_tests.sh

      - name: Keep the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
